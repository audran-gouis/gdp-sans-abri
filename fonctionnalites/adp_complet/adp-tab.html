<!-- Onglet ADP -->
<div id="adp-tab" class="tab-content">
    <div class="content-card">
        <div class="date-selector-container">
            <label for="adp-date">Date :</label>
            <input type="date" id="adp-date" class="date-input">
        </div>
        
        <div class="filters-container">
            <div class="filter-group">
                <label for="adp-filter-nom">Nom :</label>
                <input type="text" id="adp-filter-nom" class="filter-input" placeholder="Rechercher par nom">
            </div>
            
            <button id="adp-btn-ajouter" class="btn-add">+ Ajouter une personne</button>
        </div>
        
        <h2>ADP</h2>
        <p>Accueil De Proximité - Gestion des personnes rencontrées</p>
        
        <div id="adp-list" class="transmissions-container">
        </div>
    </div>
</div>
