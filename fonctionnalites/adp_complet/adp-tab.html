<!-- Onglet ADP -->
<div id="adp-tab" class="tab-content">
    <div class="content-card">
        <div class="date-selector-container">
            <label for="adp-date">Date :</label>
            <input type="date" id="adp-date" class="date-input">
        </div>
        
        <div class="filters-container">
            <div class="filter-group">
                <label for="adp-filter-nom">Nom :</label>
                <input type="text" id="adp-filter-nom" class="filter-input" placeholder="Rechercher par nom">
            </div>
            
            <div class="filter-group">
                <label for="adp-filter-prenom">Prénom :</label>
                <input type="text" id="adp-filter-prenom" class="filter-input" placeholder="Rechercher par prénom">
            </div>
            
            <div class="filter-group">
                <label for="adp-filter-ddn">Date de Naissance :</label>
                <input type="date" id="adp-filter-ddn" class="filter-input">
            </div>
            
            <div class="filter-group filter-group-checkbox">
                <label class="filter-checkbox-label">
                    <input type="checkbox" id="adp-filter-inconnu" class="filter-checkbox">
                    <span>Inconnu ?</span>
                </label>
            </div>
            
            <div class="filter-group">
                <label for="adp-filter-description">Description physique :</label>
                <input type="text" id="adp-filter-description" class="filter-input" placeholder="Rechercher par description">
            </div>
            
            <button id="adp-btn-ajouter" class="btn-add">+ Ajouter une personne</button>
        </div>
        
        <div id="adp-list" class="transmissions-container">
        </div>
    </div>
</div>
