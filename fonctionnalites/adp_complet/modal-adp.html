<!-- Modal ADP -->
<div id="modal-adp" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Ajouter / Modifier une personne ADP</h2>
            <div class="modal-actions">
                <button type="button" class="modal-expand" id="adp-btn-expand" title="Agrandir">⛶</button>
                <button type="button" class="modal-close adp-modal-close">&times;</button>
            </div>
        </div>
        
        <form id="form-adp" class="modal-body">
            <!-- Section Informations Personnelles -->
            <div class="form-section">
                <h3>Informations Personnelles</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="adp-form-nom">Nom :</label>
                        <input type="text" id="adp-form-nom" class="form-input" name="nom">
                    </div>
                    
                    <div class="form-group">
                        <label for="adp-form-prenom">Prénom :</label>
                        <input type="text" id="adp-form-prenom" class="form-input" name="prenom">
                    </div>
                    
                    <div class="form-group">
                        <label for="adp-form-ddn">Date de Naissance :</label>
                        <input type="date" id="adp-form-ddn" class="form-input" name="dateNaissance">
                    </div>
                    
                    <div class="form-group">
                        <label for="adp-form-description">Description physique :</label>
                        <textarea id="adp-form-description" class="form-textarea" name="description" rows="2"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="adp-form-inconnu" class="form-checkbox" name="inconnu">
                            <span>Personne inconnue</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <!-- Section Situation -->
            <div class="form-section">
                <h3>Situation</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="adp-form-departement">Département d'origine :</label>
                        <input type="text" id="adp-form-departement" class="form-input" name="departement">
                    </div>
                    
                    <div class="form-group">
                        <label for="adp-form-typologie">Typologie de Ménages :</label>
                        <select id="adp-form-typologie" class="form-input" name="typologie">
                            <option value="">Sélectionner...</option>
                            <option value="homme-seul">Homme Seul</option>
                            <option value="femme-seule">Femme seule</option>
                            <option value="femme-seule-avec-enfants">Femme seule avec enfant(s)</option>
                            <option value="homme-seul-avec-enfants">Homme seul avec enfant(s)</option>
                            <option value="groupe-adultes-avec-enfants">Groupe d'adultes avec enfant(s)</option>
                            <option value="groupe-adultes-sans-enfant">Groupe d'adultes sans enfant</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="adp-form-nb-personnes">Nombre de Personnes :</label>
                        <select id="adp-form-nb-personnes" class="form-input" name="nbPersonnes">
                            <option value="">Sélectionner...</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6+">6+</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="adp-form-mineurs">dont Mineurs :</label>
                        <select id="adp-form-mineurs" class="form-input" name="mineurs">
                            <option value="">Sélectionner...</option>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4+">4+</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Section Données de Transmission -->
            <div class="form-section">
                <h3>Données de Transmission</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="adp-form-type-transmission">Type de Transmission :</label>
                        <select id="adp-form-type-transmission" class="form-input" name="typeTransmission">
                            <option value="">Sélectionner...</option>
                            <option value="information">Information</option>
                            <option value="signalement">Signalement</option>
                            <option value="suivi">Suivi</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="adp-form-point-accueil" class="form-checkbox" name="pointAccueil">
                            <span>Point d'accueil</span>
                        </label>
                    </div>
                    
                    <div class="form-group">
                        <label for="adp-form-adresse">Adresse :</label>
                        <input type="text" id="adp-form-adresse" class="form-input" name="adresse">
                    </div>
                    
                    <div class="form-group">
                        <label for="adp-form-ville">Ville :</label>
                        <input type="text" id="adp-form-ville" class="form-input" name="ville">
                    </div>
                    
                    <div class="form-group">
                        <label for="adp-form-signalement">Signalement :</label>
                        <select id="adp-form-signalement" class="form-input" name="signalement">
                            <option value="">Sélectionner...</option>
                            <option value="115">115</option>
                            <option value="siao">SIAO</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Section Type d'intervention -->
            <div class="form-section">
                <h3>Type d'intervention</h3>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-premier-contact" class="form-checkbox">
                                <span>1er contact</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-personne-presente" class="form-checkbox">
                                <span>Personne présente</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-pnt" class="form-checkbox">
                                <span>PNT</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-maraude" class="form-checkbox">
                                <span>Maraude</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-veille" class="form-checkbox">
                                <span>Veille</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-refus-contact" class="form-checkbox">
                                <span>Refus de contact</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Section Accompagnement -->
            <div class="form-section">
                <h3>Accompagnement</h3>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-accomp-ecoute" class="form-checkbox">
                                <span>Écoute</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-accomp-orientation" class="form-checkbox">
                                <span>Orientation</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-accomp-admin" class="form-checkbox">
                                <span>Démarche administrative</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-accomp-medical" class="form-checkbox">
                                <span>Médical</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-accomp-hebergement" class="form-checkbox">
                                <span>Hébergement</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-accomp-autre" class="form-checkbox">
                                <span>Autre</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Section Distribution -->
            <div class="form-section">
                <h3>Distribution</h3>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-distrib-alimentaire" class="form-checkbox">
                                <span>Alimentaire</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-distrib-vestimentaire" class="form-checkbox">
                                <span>Vestimentaire</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-distrib-hygiene" class="form-checkbox">
                                <span>Hygiène</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-distrib-couvertures" class="form-checkbox">
                                <span>Couvertures</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-distrib-duvet" class="form-checkbox">
                                <span>Duvet</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="adp-form-distrib-autre" class="form-checkbox">
                                <span>Autre</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Section Contenu -->
            <div class="form-section">
                <h3>Contenu de la transmission</h3>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="adp-form-transmission">Commentaires :</label>
                        <textarea id="adp-form-transmission" class="form-textarea" rows="4"></textarea>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="adp-btn-annuler">Annuler</button>
                <button type="submit" class="btn-primary">Enregistrer</button>
            </div>
        </form>
    </div>
</div>
