<!-- 
  EXEMPLE DE VÉRIFICATION MANUELLE
  
  Si vous voulez vérifier sans créer automatiquement :
-->

<script>
async function verifierAvantCreer() {
  const infos = {
    nom: document.getElementById('nom').value,
    prenom: document.getElementById('prenom').value,
    dateNaissance: document.getElementById('dateNaissance').value
  };
  
  const doublons = await verifierDoublonsAvantCreation(infos);
  
  if (doublons.length > 0) {
    console.log(`⚠️ ${doublons.length} doublon(s) potentiel(s) trouvé(s)`);
    doublons.forEach(d => {
      console.log(`- ${d.nom} ${d.prenom} (${d.nbInterventions} interventions)`);
    });
    
    // Afficher la modale d'avertissement
    const resultat = await afficherAvertissementDoublons(doublons);
    
    if (resultat.action === 'utiliser') {
      console.log(`Utilisation de la fiche existante #${resultat.personneId}`);
      return resultat.personneId;
    } else if (resultat.action === 'annuler') {
      console.log('Création annulée');
      return null;
    }
  }
  
  // Créer la nouvelle personne
  return await creerOuRecupererPersonne(infos);
}
</script>

<!-- 
  EXÉCUTER UNE DÉTECTION AUTOMATIQUE AU DÉMARRAGE
  
  Pour scanner automatiquement au chargement :
-->

<script>
window.addEventListener('load', async () => {
  console.log('🔍 Vérification des doublons au démarrage...');
  
  const rapport = await genererRapportDoublons();
  
  if (rapport.doublonsPersonnes.nombre > 0 || rapport.doublonsInterventions.nombre > 0) {
    console.warn(`⚠️ Doublons détectés !`);
    console.log(`- ${rapport.doublonsPersonnes.nombre} groupe(s) de personnes`);
    console.log(`- ${rapport.doublonsInterventions.nombre} groupe(s) d'interventions`);
    
    // Afficher une notification
    if (confirm(`⚠️ ${rapport.doublonsPersonnes.nombre} groupe(s) de doublons détecté(s).\n\nVoulez-vous ouvrir la gestion des doublons ?`)) {
      ouvrirGestionDoublons();
    }
  } else {
    console.log('✅ Aucun doublon détecté');
  }
});
</script>

<!-- 
  NETTOYAGE AUTOMATIQUE DES INTERVENTIONS
  
  Pour nettoyer automatiquement au démarrage :
-->

<script>

<script>
// Toggle menu admin
document.getElementById('btn-toggle-menu-admin')?.addEventListener('click', () => {
  const menu = document.getElementById('menu-admin-dropdown');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
});

// Liens du menu
document.getElementById('menu-link-gerer-doublons')?.addEventListener('click', (e) => {
  e.preventDefault();
  ouvrirGestionDoublons();
});

document.getElementById('menu-link-stats-doublons')?.addEventListener('click', (e) => {
  e.preventDefault();
  afficherStatistiquesDoublons();
});

document.getElementById('menu-link-export-doublons')?.addEventListener('click', (e) => {
  e.preventDefault();
  exporterRapportDoublons();
});

async function afficherStatistiquesDoublons() {
  const rapport = await genererRapportDoublons();
  alert(`
📊 STATISTIQUES DOUBLONS

Personnes:
- ${rapport.doublonsPersonnes.nombre} groupe(s) de doublons
- ${rapport.doublonsPersonnes.totalPersonnesConcernees} personne(s) concernée(s)

Interventions:
- ${rapport.doublonsInterventions.nombre} groupe(s) de doublons
- ${rapport.doublonsInterventions.totalInterventionsConcernees} intervention(s) concernée(s)

Date: ${new Date(rapport.dateRapport).toLocaleString('fr-FR')}
  `);
}

async function exporterRapportDoublons() {
  const rapport = await genererRapportDoublons();
  const blob = new Blob([JSON.stringify(rapport, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rapport-doublons-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  alert('✅ Rapport téléchargé');
}
</script>
