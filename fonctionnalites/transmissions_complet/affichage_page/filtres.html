<!-- Filtres de recherche pour l'onglet Transmissions -->
<div class="filters-container">
    <div class="filter-group">
        <label for="filter-nom">Nom :</label>
        <input type="text" id="filter-nom" class="filter-input" placeholder="Rechercher par nom" autocomplete="family-name">
    </div>
    
    <div class="filter-group">
        <label for="filter-prenom">Prénom :</label>
        <input type="text" id="filter-prenom" class="filter-input" placeholder="Rechercher par prénom" autocomplete="given-name">
    </div>
    
    <div class="filter-group">
        <label for="filter-ddn">Date de Naissance :</label>
        <input type="date" id="filter-ddn" class="filter-input">
    </div>
    
    <button id="btn-ajouter" class="btn-add">Ajouter</button>
</div>
