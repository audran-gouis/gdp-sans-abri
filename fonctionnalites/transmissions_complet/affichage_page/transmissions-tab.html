<!-- Onglet Transmissions Quotidiennes -->
<div id="transmissions-tab" class="tab-content active">
    <div class="content-card">
        <div class="date-selector-container">
            <label for="transmissions-date">Date :</label>
            <input type="date" id="transmissions-date" class="date-input">
        </div>
        
        <div class="filters-container">
            <div class="filter-group">
                <label for="filter-nom">Nom :</label>
                <input type="text" id="filter-nom" class="filter-input" placeholder="Rechercher par nom" autocomplete="family-name">
            </div>
            
            <div class="filter-group">
                <label for="filter-prenom">Prénom :</label>
                <input type="text" id="filter-prenom" class="filter-input" placeholder="Rechercher par prénom" autocomplete="given-name">
            </div>
            
            <div class="filter-group">
                <label for="filter-ddn">Date de Naissance :</label>
                <input type="date" id="filter-ddn" class="filter-input">
            </div>
            
            <div class="filter-group filter-group-checkbox">
                <label class="filter-checkbox-label">
                    <input type="checkbox" id="filter-inconnu" class="filter-checkbox">
                    <span>Inconnu ?</span>
                </label>
            </div>
            
            <div class="filter-group">
                <label for="filter-description">Description physique :</label>
                <input type="text" id="filter-description" class="filter-input" placeholder="Rechercher par description">
            </div>
            
            <button id="btn-ajouter" class="btn-add">+ Ajouter une personne</button>
        </div>
        
        <h2>Transmissions Quotidiennes</h2>
        <p>Gérez vos transmissions quotidiennes ici.</p>
        
        <div id="transmissions-list" class="transmissions-container">
        </div>
    </div>
</div>
