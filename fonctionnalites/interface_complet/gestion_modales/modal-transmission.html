<!-- Modal Ajout Transmission -->
<div id="modal-ajout" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Nouvelle Personne</h2>
            <div class="modal-actions">
                <button class="modal-expand" id="btn-expand" title="Agrandir">⛶</button>
                <button class="modal-close">&times;</button>
            </div>
        </div>
        
        <form id="form-modal-transmission" class="modal-body">
            <!-- Section Informations Personnelles -->
            <div class="form-section" id="section-info-perso">
                <h3 class="section-header">
                    Informations Personnelles
                    <span class="collapse-toggle">▼</span>
                </h3>
                <div class="form-grid" id="grid-info-perso">
                    <div class="form-group">
                        <label for="form-nom">Nom :</label>
                        <input type="text" id="form-nom" class="form-input" autocomplete="family-name">
                    </div>
                    
                    <div class="form-group">
                        <label for="form-prenom">Prénom :</label>
                        <input type="text" id="form-prenom" class="form-input" autocomplete="given-name">
                    </div>
                    
                    <div class="form-group">
                        <label for="form-ddn">Date de Naissance :</label>
                        <input type="date" id="form-ddn" class="form-input">
                    </div>
                    
                    <div class="form-group">
                        <label for="form-typologie">Typologie de Ménages :</label>
                        <select id="form-typologie" class="form-input">
                            <option value="">Sélectionner...</option>
                            <option value="homme-seul">Homme Seul</option>
                            <option value="femme-seule">Femme seule</option>
                            <option value="femme-seule-avec-enfants">Femme seule avec enfant(s)</option>
                            <option value="homme-seul-avec-enfants">Homme seul avec enfant(s)</option>
                            <option value="groupe-adultes-avec-enfants">Groupe d'adultes avec enfant(s)</option>
                            <option value="groupe-adultes-sans-enfant">Groupe d'adultes sans enfant</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="form-nb-personnes">Nombre de Personnes :</label>
                        <select id="form-nb-personnes" class="form-input">
                            <option value="">Sélectionner...</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6+">6+</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="form-mineurs">dont Mineurs :</label>
                        <select id="form-mineurs" class="form-input">
                            <option value="">Sélectionner...</option>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4+">4+</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Section Données de Transmission -->
            <div class="form-section">
                <h3>Données de Transmission</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="form-type-transmission">Type de Transmission :</label>
                        <select id="form-type-transmission" class="form-input">
                            <option value="">Sélectionner...</option>
                            <option value="jour">Jour</option>
                            <option value="nuit">Nuit</option>
                            <option value="coordination">Coordination</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="form-adresse">Adresse :</label>
                        <input type="text" id="form-adresse" class="form-input" placeholder="Adresse">
                    </div>
                    
                    <div class="form-group">
                        <label for="form-ville">Ville :</label>
                        <input type="text" id="form-ville" class="form-input" placeholder="Ville">
                    </div>
                    
                    <div class="form-group">
                        <label for="form-signalement">Signalement :</label>
                        <select id="form-signalement" class="form-input">
                            <option value="">Sélectionner...</option>
                            <option value="115">115</option>
                            <option value="mairie">Mairie</option>
                            <option value="police">Police</option>
                            <option value="association">Association</option>
                            <option value="particulier">Particulier</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Section Type d'intervention -->
            <div class="form-section">
                <h3>Type d'intervention</h3>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-premier-contact" class="form-checkbox">
                                <span>1er contact</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-personne-presente" class="form-checkbox">
                                <span>Personne présente</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-pnt" class="form-checkbox">
                                <span>PNT</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-maraude" class="form-checkbox">
                                <span>Maraude</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-veille" class="form-checkbox">
                                <span>Veille</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-refus-contact" class="form-checkbox">
                                <span>Refus de contact</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Section Accompagnement -->
            <div class="form-section">
                <h3>Accompagnement</h3>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-accomp-ecoute" class="form-checkbox">
                                <span>Écoute</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-accomp-orientation" class="form-checkbox">
                                <span>Orientation</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-accomp-admin" class="form-checkbox">
                                <span>Démarche administrative</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-accomp-medical" class="form-checkbox">
                                <span>Médical</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-accomp-hebergement" class="form-checkbox">
                                <span>Hébergement</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-accomp-autre" class="form-checkbox">
                                <span>Autre</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Section Distribution -->
            <div class="form-section">
                <h3>Distribution</h3>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-distrib-alimentaire" class="form-checkbox">
                                <span>Alimentaire</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-distrib-vestimentaire" class="form-checkbox">
                                <span>Vestimentaire</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-distrib-hygiene" class="form-checkbox">
                                <span>Hygiène</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-distrib-couvertures" class="form-checkbox">
                                <span>Couvertures</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-distrib-duvet" class="form-checkbox">
                                <span>Duvet</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="form-distrib-autre" class="form-checkbox">
                                <span>Autre</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Section Contenu -->
            <div class="form-section">
                <h3>Contenu de la transmission</h3>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="form-transmission">Commentaires :</label>
                        <textarea id="form-transmission" class="form-textarea" rows="4"></textarea>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="btn-annuler">Annuler</button>
                <button type="submit" class="btn-primary">Enregistrer</button>
            </div>
        </form>
    </div>
</div>
