<!-- Onglet Statistiques -->
<div id="statistiques-tab" class="tab-content">
    <div class="content-card">
        <!-- Sélecteurs en ligne : Source + Période + Date -->
        <div class="stats-inline-selectors">
            <!-- Sélecteur de source -->
            <div class="stats-selector-item">
                <label for="stats-source">Source des données :</label>
                <select id="stats-source" class="stats-select">
                    <option value="all">Toutes les sources</option>
                    <option value="transmissions">Transmissions uniquement</option>
                    <option value="adp">ADP uniquement</option>
                    <option value="pointAccueil">Point Accueil uniquement</option>
                </select>
            </div>
            
            <!-- Sélecteur de période -->
            <div class="stats-selector-item">
                <label for="stats-period-type">Période :</label>
                <select id="stats-period-type" class="stats-select">
                    <option value="day">Jour précis</option>
                    <option value="month">Mois</option>
                    <option value="year">Année</option>
                    <option value="range">Plage de dates</option>
                </select>
            </div>
            
            <!-- Jour précis -->
            <div id="stats-day-selector" class="stats-selector-item stats-date-option active">
                <label for="stats-specific-day">Date :</label>
                <input type="date" id="stats-specific-day" class="date-input">
            </div>
            
            <!-- Mois -->
            <div id="stats-month-selector" class="stats-selector-item stats-date-option">
                <label for="stats-month">Mois :</label>
                <input type="month" id="stats-month" class="date-input">
            </div>
            
            <!-- Année -->
            <div id="stats-year-selector" class="stats-selector-item stats-date-option">
                <label for="stats-year">Année :</label>
                <input type="number" id="stats-year" class="date-input" min="2000" max="2100" placeholder="AAAA">
            </div>
            
            <!-- Plage de dates -->
            <div id="stats-range-selector" class="stats-selector-range stats-date-option">
                <div class="stats-selector-item">
                    <label for="stats-date-start">Du :</label>
                    <input type="date" id="stats-date-start" class="date-input">
                </div>
                <div class="stats-selector-item">
                    <label for="stats-date-end">Au :</label>
                    <input type="date" id="stats-date-end" class="date-input">
                </div>
            </div>
        </div>
        
        <!-- Filtres organisés comme le formulaire -->
        <div class="stats-filters-complete">
            <!-- Section Informations Personnelles -->
            <div class="stats-filter-section">
                <h3>Informations Personnelles</h3>
                <div class="filters-grid">
                    <div class="filter-group">
                        <label for="stats-filter-nom">Nom :</label>
                        <input type="text" id="stats-filter-nom" class="filter-input" placeholder="Rechercher">
                    </div>
                    
                    <div class="filter-group">
                        <label for="stats-filter-prenom">Prénom :</label>
                        <input type="text" id="stats-filter-prenom" class="filter-input" placeholder="Rechercher">
                    </div>
                    
                    <div class="filter-group">
                        <label for="stats-filter-ddn">Date de Naissance :</label>
                        <input type="date" id="stats-filter-ddn" class="filter-input">
                    </div>
                    
                    <div class="filter-group">
                        <label for="stats-filter-description">Description physique :</label>
                        <input type="text" id="stats-filter-description" class="filter-input" placeholder="Rechercher">
                    </div>
                    
                    <div class="filter-group">
                        <label for="stats-filter-inconnu">Personne inconnue :</label>
                        <select id="stats-filter-inconnu" class="filter-input">
                            <option value="">Tous</option>
                            <option value="connus">Connus</option>
                            <option value="inconnus">Inconnus</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Section Situation -->
            <div class="stats-filter-section">
                <h3>Situation</h3>
                <div class="filters-grid">
                    <div class="filter-group">
                        <label for="stats-filter-departement">Département d'origine :</label>
                        <input type="text" id="stats-filter-departement" class="filter-input" placeholder="Ex: 75, 93...">
                    </div>
                    
                    <div class="filter-group">
                        <label for="stats-filter-typologie">Typologie de Ménages :</label>
                        <select id="stats-filter-typologie" class="filter-input">
                            <option value="">Tous</option>
                            <option value="homme-seul">Homme Seul</option>
                            <option value="femme-seule">Femme seule</option>
                            <option value="femme-seule-avec-enfants">Femme seule avec enfant(s)</option>
                            <option value="homme-seul-avec-enfants">Homme seul avec enfant(s)</option>
                            <option value="groupe-adultes-avec-enfants">Groupe d'adultes avec enfant(s)</option>
                            <option value="groupe-adultes-sans-enfant">Groupe d'adultes sans enfant</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="stats-filter-nb-personnes">Nombre de Personnes :</label>
                        <select id="stats-filter-nb-personnes" class="filter-input">
                            <option value="">Tous</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6+">6+</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="stats-filter-mineurs">dont Mineurs :</label>
                        <select id="stats-filter-mineurs" class="filter-input">
                            <option value="">Tous</option>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4+">4+</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Section Données de Transmission -->
            <div class="stats-filter-section">
                <h3>Données de Transmission</h3>
                <div class="filters-grid">
                    <div class="filter-group">
                        <label for="stats-filter-type-transmission">Type de Transmission :</label>
                        <select id="stats-filter-type-transmission" class="filter-input">
                            <option value="">Tous</option>
                            <option value="jour">Jour</option>
                            <option value="nuit">Nuit</option>
                            <option value="information">Information</option>
                            <option value="signalement">Signalement</option>
                            <option value="suivi">Suivi</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="stats-filter-adresse">Adresse :</label>
                        <input type="text" id="stats-filter-adresse" class="filter-input" placeholder="Rechercher">
                    </div>
                    
                    <div class="filter-group">
                        <label for="stats-filter-ville">Ville :</label>
                        <input type="text" id="stats-filter-ville" class="filter-input" placeholder="Rechercher">
                    </div>
                    
                    <div class="filter-group">
                        <label for="stats-filter-signalement">Signalement :</label>
                        <select id="stats-filter-signalement" class="filter-input">
                            <option value="">Tous</option>
                            <option value="115">115</option>
                            <option value="siao">SIAO</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Section Type d'intervention, Accompagnement et Distribution -->
            <div class="stats-filter-section">
                <h3>Type d'intervention, Accompagnement et Distribution</h3>
                <div class="filters-grid">
                    <div class="filter-group">
                        <label for="stats-filter-type-intervention">Type d'intervention :</label>
                        <select id="stats-filter-type-intervention" class="filter-input" multiple size="6">
                            <option value="premier-contact">1er contact</option>
                            <option value="personne-presente">Personne présente</option>
                            <option value="pnt">PNT</option>
                            <option value="maraude">Maraude</option>
                            <option value="veille">Veille</option>
                            <option value="refus-contact">Refus de contact</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="stats-filter-accompagnement">Accompagnement :</label>
                        <select id="stats-filter-accompagnement" class="filter-input" multiple size="6">
                            <option value="ecoute">Écoute</option>
                            <option value="orientation">Orientation</option>
                            <option value="admin">Démarche administrative</option>
                            <option value="medical">Médical</option>
                            <option value="hebergement">Hébergement</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="stats-filter-distribution">Distribution :</label>
                        <select id="stats-filter-distribution" class="filter-input" multiple size="6">
                            <option value="alimentaire">Alimentaire</option>
                            <option value="vestimentaire">Vestimentaire</option>
                            <option value="hygiene">Hygiène</option>
                            <option value="couvertures">Couvertures</option>
                            <option value="duvet">Duvet</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Boutons d'action -->
            <div class="stats-filter-actions">
                <button id="stats-reset-filters" class="btn-secondary">Réinitialiser</button>
                <button id="stats-apply-filter" class="btn-add">Appliquer les filtres</button>
            </div>
        </div>
        
        <!-- Contenu des statistiques -->
        <div id="stats-content">
            <p>Sélectionnez une période et des filtres pour afficher les statistiques.</p>
        </div>
        
        <!-- Section des cartes filtrées -->
        <div id="stats-cards-section" style="display: none;">
            <div class="stats-cards-header">
                <h3>Personnes correspondantes</h3>
                <button id="stats-hide-cards" class="btn-secondary">Masquer</button>
            </div>
            <div id="stats-cards-list" class="transmissions-container"></div>
        </div>
        
        <!-- Bouton pour afficher les cartes -->
        <div class="stats-filter-actions" style="margin-top: 1rem;">
            <button id="stats-show-cards" class="btn-add">Afficher les personnes</button>
        </div>
    </div>
</div>
