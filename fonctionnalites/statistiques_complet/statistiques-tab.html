<!-- Onglet Statistiques -->
<div id="statistiques-tab" class="tab-content">
    <div class="content-card">
        <!-- Sélecteurs en ligne : Source + Période + Date -->
        <div class="stats-inline-selectors">
            <!-- Sélecteur de source -->
            <div class="stats-selector-item">
                <label for="stats-source">Source des données :</label>
                <select id="stats-source" class="stats-select">
                    <option value="all">Toutes les sources</option>
                    <option value="transmissions">Transmissions uniquement</option>
                    <option value="adp">ADP uniquement</option>
                    <option value="pointAccueil">Point Accueil uniquement</option>
                </select>
            </div>
            
            <!-- Sélecteur de période -->
            <div class="stats-selector-item">
                <label for="stats-period-type">Période :</label>
                <select id="stats-period-type" class="stats-select">
                    <option value="day">Jour précis</option>
                    <option value="month">Mois</option>
                    <option value="year">Année</option>
                    <option value="range">Plage de dates</option>
                </select>
            </div>
            
            <!-- Jour précis -->
            <div id="stats-day-selector" class="stats-selector-item stats-date-option active">
                <label for="stats-specific-day">Date :</label>
                <input type="date" id="stats-specific-day" class="date-input">
            </div>
            
            <!-- Mois -->
            <div id="stats-month-selector" class="stats-selector-item stats-date-option">
                <label for="stats-month">Mois :</label>
                <input type="month" id="stats-month" class="date-input">
            </div>
            
            <!-- Année -->
            <div id="stats-year-selector" class="stats-selector-item stats-date-option">
                <label for="stats-year">Année :</label>
                <input type="number" id="stats-year" class="date-input" min="2000" max="2100" placeholder="AAAA">
            </div>
            
            <!-- Plage de dates -->
            <div id="stats-range-selector" class="stats-selector-range stats-date-option">
                <div class="stats-selector-item">
                    <label for="stats-date-start">Du :</label>
                    <input type="date" id="stats-date-start" class="date-input">
                </div>
                <div class="stats-selector-item">
                    <label for="stats-date-end">Au :</label>
                    <input type="date" id="stats-date-end" class="date-input">
                </div>
            </div>
        </div>

        <!-- Section des cartes filtrées -->

            </div>
            <div id="stats-cards-list" class="transmissions-container"></div>
        </div>
        
        <!-- Bouton pour afficher les cartes -->
